name = "your-daily-preview"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "ahsanfashion.shop", zone_name = "ahsanfashion.shop", custom_domain = true }
]

compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# `main` and `assets` are generated by the build (dist/server/wrangler.json);
# do not set them here.

# Product images live here now instead of Supabase Storage — R2 has zero
# egress fees, which is what Supabase's "Cached Egress" quota was charging
# for. One-time setup before the first deploy with this binding:
#   npx wrangler r2 bucket create product-images
[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "product-images"

[vars]
# ---------------------------------------------------------------------------
# Image recovery origins.
#
# This project has moved between three Supabase projects. A SQL export carries
# the rows but NOT the Storage bucket, so images uploaded while the site lived
# on an older project are still sitting in that older project's bucket.
#
# List those old project URLs here (comma-separated, no spaces). On a cache
# miss the Worker will pull the file from the first origin that still has it
# and copy it into R2, so each file only ever crosses the network once.
#
# Remove an entry once the old project is deleted — a dead origin just costs
# a failed request.
LEGACY_IMAGE_ORIGINS = "https://ldsnvxmaghkeinfjkpqz.supabase.co,https://xvxmydbhhpxiemmpahzo.supabase.co"

# The Lovable preview host, if it is still up. Used only for the bundled
# catalog art (/__l5e/assets-v1/...) — logo, hero cover, category tiles and
# the seeded product photos, at their original untouched URLs.
#
# Example:
# LOVABLE_ORIGIN = "https://your-project.lovable.app"
LOVABLE_ORIGIN = "https://lovable.dev/projects/7dd95b2e-9d7e-473b-a628-41ef7bb6eda5"

# Deploy:
#   npm run build && npx wrangler deploy
#
# Secrets (set once, never commit):
#   npx wrangler secret put SUPABASE_URL
#   npx wrangler secret put SUPABASE_PUBLISHABLE_KEY
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#
# VITE_* values are baked in at build time, so they must be present in the
# build environment (.env locally, or the CI/Cloudflare build env vars).
#
# After deploying, confirm the pipeline with:
#   https://<your-domain>/api/img-status
